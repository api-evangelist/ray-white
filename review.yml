homonymTrap:
  warning: |
    "Ray White" is also the name of multiple individual licensed real estate
    agents in the United States (Keller Williams Baytown TX, HAR.com Houston,
    RE/MAX, 1st USA Realty, an "Ray White Atlanta Sales" LinkedIn profile). Those
    individuals ARE MLS members and would appear behind RESO-certified MLS
    feeds — none of that has anything to do with Ray White Group of Australia.
    Any future RESO or MLS signal matched on the string "Ray White" must be
    rejected unless it resolves to raywhite.com / Ray White Group Pty Ltd.

