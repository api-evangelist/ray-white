findings:
  summary: |
    Ray White is a BUILT-STUB. It is a large, real, consequential real estate
    organisation with a genuinely sophisticated internal technology stack and
    zero public API surface. Every developer-facing probe failed: four developer
    subdomains do not resolve, seven conventional contract paths return 404, and
    the site's own sitemap — which enumerates every section of raywhite.com —
    contains no developer, api, docs, integration or partner area at all. There
    is no OpenAPI, no OData $metadata, no GraphQL, no AsyncAPI, no SDK, no
    Postman collection, no webhook catalogue and no OIDC discovery document.
    RESO is entirely absent and Ray White does not appear in the RESO
    certification directory, which is the correct and expected answer for an
    Australian brokerage. The single most important characterisation is that Ray
    White is an API CONSUMER — it buys licensed API access from REA
    Group/PropTrack and pipes it into OneSystem, NurtureCloud and Pulse — and
    publishes nothing back. The access gate is therefore none-published: there
    is no form to fill, no association to join, no licence to sign, because no
    access path is offered.
  status: built-stub
  apisListed: 0
  developerPortal: ''
  portalConfirmed: false
