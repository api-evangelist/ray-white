aid: ray-white
name: Ray White
review:
  question: Does Ray White publish a public, machine-readable API surface — and what
    is its RESO posture as an Australian brokerage?
  answer: false
  date: '2026-07-26'
  reviewer: API Evangelist
  tier: brokerage
  homeMarket: Australia
  specsHarvested: 0
  openapiHarvested: false

sector:
  homeMarket: Australia
  valueChainPosition: |
    Ray White is a BROKERAGE / agency network. It sits downstream of the
    Australian portal duopoly (REA Group's realestate.com.au and Domain) as a
    LISTER into those portals, not as an operator of one. It is downstream of
    state land registries (progressively privatised — NSW LRS, Victoria's
    Landata/Secure Title, etc.) and it transacts across PEXA, the electronic
    conveyancing network that settles the overwhelming majority of Australian
    property transactions and is effectively mandated in most states. Valuation
    data reaches Ray White from PropTrack (REA-owned) and CoreLogic under
    commercial licence — it does not originate valuation data itself.
  apiRole: consumer
  apiRoleEvidence: |
    Ray White's own December 2025 announcement makes the consumer posture
    explicit. Verbatim, from
    https://www.raywhite.com/news-and-market-insights/news-media/ray-white-and-rea-group-announce-landmark-partnership
    (HTTP 200, fetched 2026-07-26): "We chose realestate.com.au and PropTrack as
    our data partners because their unmatched market insights, industry leading
    API architecture, combined with our tech stack, will help propel the growth
    of our 550+ Australian offices." Ray White consumes those licensed APIs into
    its proprietary OneSystem, NurtureCloud and Pulse platforms. It publishes no
    API of its own.

resoPosture:
  summary: No RESO reference found — RESO is absent from Ray White entirely, as
    expected for an Australian brokerage with no NAR/MLS relationship.
  certified: false
  certificationType: none
  dataDictionaryVersion: null
  webApiCertified: false
  upiPresent: false
  odataMetadataFound: false
  directoryEvidence: |
    The RESO certification directory at https://www.reso.org/certificates/ was
    fetched anonymously on 2026-07-26 (HTTP 200, 416,233 bytes). The page is
    server-rendered and contains the complete Certified Current / Passed Current
    / Certified Legacy list across all four RESO sections (Data Providers, MLS,
    Pooled Platform, Technology Company, Commercial Brokerage), each entry
    carrying a UOI and a https://certification.reso.org/summary/<UOI> link. A
    case-insensitive grep for "ray[ -]?white" returned ZERO matches. A grep for
    "australia|australian" also returned ZERO matches — the directory is
    effectively North American. Ray White is therefore not RESO certified under
    any section, and no RESO Universal Property Identifier (UPI) is associated
    with it.
  whyAbsent: |
    RESO certification is mandated by the National Association of REALTORS (NAR)
    for US MLSs and adopted by North American data providers and technology
    vendors. Australia has no MLS system and no NAR — listings flow agent →
    portal (realestate.com.au / Domain) via REAXML-style feeds under commercial
    agreements, not via a certified, standardised Web API. The honest finding for
    every Australian brokerage in this study is that RESO is simply not part of
    the market's architecture. The closest Australian analogue to a REQUIRED,
    national, machine-readable property rail is PEXA electronic conveyancing —
    but PEXA is a settlement network Ray White participates in, not a contract
    Ray White publishes.
  odataProbes:
  - url: https://www.raywhite.com/$metadata
    status: 404
  - url: https://www.raywhite.com/api-docs
    status: 404

accessGate:
  gate: none-published
  gated: true
  whatADeveloperMustSignOrJoin: |
    Nothing is published, because there is nothing published to apply for. Ray
    White operates no developer programme, no partner-API application form, no
    API terms of service, and no data-licence page. A third party wanting Ray
    White listing or CRM data has no documented self-serve, application-approval,
    or licence path — the only route evidenced anywhere is a bilateral
    commercial arrangement of the kind Ray White itself struck with REA
    Group/PropTrack (and previously PropTech Group), negotiated company to
    company. Ray White's internal platforms (OneSystem, NurtureCloud, Pulse) are
    franchise-network tooling for its own principals and agents; NurtureCloud's
    public site (https://nurturecloud.com/, HTTP 200) names no API, no developer
    documentation and no integration surface, listing only iOS/Android apps and
    a nurturecloud@raywhite.com support address.
  distinctionFromCertification: |
    This provider is the inverse of the RESO trap the study is built to catch. In
    the US the danger is reading a RESO certificate as reachability. Here there
    is neither a certificate NOR a reachable endpoint — no contract is claimed
    and none exists, which is at least internally consistent and honestly
    reported as such.

openData:
  present: false
  notes: |
    Ray White publishes no open dataset. Its property listings, agent directory
    and market commentary (the White Report, economic updates) are HTML pages on
    raywhite.com under ordinary site terms, not an open-licensed, callable
    dataset. Australia's open-data counterweight in property sits with government
    (state land registry products, data.gov.au, ABS/PEXA statistical releases)
    and not with brokerages. Nothing under raywhite.com meets the bar for
    open_data.

authModel:
  scheme: none-published
  oidcDiscovery:
    url: https://www.raywhite.com/.well-known/openid-configuration
    status: 404
    served: false
  notes: |
    No API key programme, no OAuth 2.0 authorization server, no OpenID Connect
    discovery document, and no documented SAML federation to a member portal
    could be found on the public web properties. Agent/principal sign-in to the
    OneSystem/NurtureCloud stack happens behind franchise-network credentials
    that are not documented publicly and were not probed.

webhooksEventsSdksPostman:
  webhooks: false
  events: false
  sdks: false
  postman: false
  notes: |
    Absence across the board is the finding. No webhook catalogue, no event
    stream, no first-party SDK in any language, no published Postman workspace
    or collection. The GitHub organisation https://github.com/raywhite (HTTP 200,
    login "raywhite", name "Ray White", location "Australia", blog
    "https://raywhite.com", created 2016-03-18, 9 public repos, unverified)
    is plausibly the group's engineering org but contains no first-party API
    artifacts — 6 of 9 repos are forks of third-party projects (PhlyRestfully,
    MssqlBundle, xpmock, splunk-aws-serverless-apps, terraform-aws-glue,
    dbt-bigquery) and the 3 non-forks are generic utilities (pico-dom,
    async-hofs, dotfiles_macos). No OpenAPI, no AsyncAPI, no spec repo.

productApiFamily:
  notes: |
    Ray White's real product segmentation is business-line, not API-line, because
    no API line exists. Recorded faithfully as business capability only, with NO
    implied endpoints — listings/search (residential, commercial via
    rwc.com.au / raywhitecommercial.com, rural and livestock, marine, projects,
    hotels via HTL Property), auctions (Auctions Live online auction portal at
    https://auctionslive.com/, HTTP 200), property management and tenancy,
    valuations, business sales, insurance, and mortgage broking via sister brand
    Loan Market (https://www.loanmarket.com.au/, HTTP 200). None of these is
    exposed as a documented API.

