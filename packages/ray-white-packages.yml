    proprietary agent platform, previously Upside Realty) — carrying generic
    front-end/utility libraries and re-published forks of third-party packages.
    They are catalogued here for completeness and provenance; none of them is a
    client library for a Ray White API, so no `SDKs` pointer is emitted in
    apis.yml (emitting one would misrepresent the provider's SDK posture).
