source: live anonymous probes of the /.well-known/ surface on every Ray White web host
note: |
  Ray White publishes no API, so there is no API host to probe — the hosts below
  are the group's public web properties (see review.yml). All probes were run
  with a desktop Chrome User-Agent; the edge in front of raywhite.com returns 403
  to default curl User-Agents. The one real hit is an RFC 9116 security.txt on
  www.raywhite.com, saved verbatim as ray-white-security.txt. Note that the
  Policy, Encryption and Acknowledgements URLs that file declares all return 404
  as of this probe, and its Expiration date (2026-07-27) is one day away — the
  document is real but stale/partially unresolvable.
