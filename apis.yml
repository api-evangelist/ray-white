description: Ray White is Australasia's largest real estate group, a family-owned
  brokerage network founded in 1902 and headquartered in Brisbane, Australia, running
  550+ Australian offices and roughly a thousand offices in total across Australia,
  New Zealand, Indonesia, Hong Kong, China, Papua New Guinea, the Middle East and
  Atlanta USA, spanning residential sales, auctions, commercial (Ray White Commercial
  / rwc.com.au), rural and livestock, property management, projects, marine, hotels,
  valuations, business sales, insurance and mortgage broking through sister brand
  Loan Market. In the Australian property value chain Ray White sits on the AGENCY
  side of a portal duopoly — it lists into REA Group's realestate.com.au and Domain
  rather than operating a portal or a registry of its own — and it is an API CONSUMER,
  not an API producer. In December 2025 Ray White named realestate.com.au and PropTrack
  its data partners explicitly for their "industry leading API architecture", piping
  that licensed market data into its proprietary OneSystem, NurtureCloud and Pulse
  platforms. Its API posture is therefore honestly stated as none-published — as of
  2026-07-26 no developer portal, no public API documentation, no OpenAPI or OData
  $metadata contract, and no published partner-API application path could be found
  on raywhite.com or any developer/api/docs subdomain (all of which fail DNS
  resolution). RESO is absent — Ray White does not appear in the RESO certification
  directory, which is unsurprising because RESO is a North American, NAR-driven
  mandate with no Australian counterpart; Australia's closest thing to a required
  machine-readable property rail is PEXA electronic conveyancing, which Ray White
  transacts through as a participant rather than exposes.
